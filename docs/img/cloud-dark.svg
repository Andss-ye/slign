<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 110" class="slign slign-cloud" role="img" aria-label="Cloud" fill="none" stroke="#c9c6ff" stroke-linecap="round" stroke-linejoin="round"><style>.slign{--_w:var(--slign-stroke,3);max-width:100%;height:auto;overflow:visible}.slign:not([width]){width:var(--slign-size,8em)}.slign .sl-l,.slign .sl-dot{stroke-width:var(--_w)}.slign .sl-thin{stroke-width:calc(var(--_w)*.67)}.slign .sl-eye{stroke-width:calc(var(--_w)*1.5);transform-box:fill-box;transform-origin:center;animation:slign-blink 5.2s infinite}.slign .sl-b{opacity:0}.slign .sl-hop{transition:transform .45s cubic-bezier(.34,1.56,.64,1)}:is(.slign:hover,.slign.slign-active,[data-slign-trigger]:hover .slign,[data-slign-trigger]:focus-within .slign,[data-slign-trigger]:active .slign) .sl-hop{transform:translateY(-3px)}:is(.slign:hover,.slign.slign-active,[data-slign-trigger]:hover .slign,[data-slign-trigger]:focus-within .slign,[data-slign-trigger]:active .slign) .sl-a{animation:slign-boil-a .34s step-end infinite}:is(.slign:hover,.slign.slign-active,[data-slign-trigger]:hover .slign,[data-slign-trigger]:focus-within .slign,[data-slign-trigger]:active .slign) .sl-b{animation:slign-boil-b .34s step-end infinite}@keyframes slign-boil-a{0%{opacity:1}50%{opacity:0}}@keyframes slign-boil-b{0%{opacity:0}50%{opacity:1}}@keyframes slign-blink{0%,93%,100%{transform:none}96.5%{transform:scaleY(.12)}}@media (prefers-reduced-motion:reduce){.slign *{animation:none!important;transition:none!important}}.slign-cloud .sl-drop1,.slign-cloud .sl-drop2,.slign-cloud .sl-drop3{opacity:0}:is(.slign-cloud:hover,.slign-cloud.slign-active,[data-slign-trigger]:hover .slign-cloud,[data-slign-trigger]:focus-within .slign-cloud,[data-slign-trigger]:active .slign-cloud) .sl-puff{animation:slign-cloud-float 2.4s ease-in-out infinite alternate}:is(.slign-cloud:hover,.slign-cloud.slign-active,[data-slign-trigger]:hover .slign-cloud,[data-slign-trigger]:focus-within .slign-cloud,[data-slign-trigg